<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="apertureDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18253D"/>
      <stop offset="100%" stop-color="#111C30"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2F6FE0"/>
    </linearGradient>
    <filter id="focusGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer lens barrel rim with theme-aware accent ring -->
  <circle cx="50" cy="50" r="46" fill="#111C30" stroke="#3B82F6" stroke-width="2.5" style="fill:var(--surface, #111C30); stroke:var(--accent, #3B82F6);"/>
  <circle cx="50" cy="50" r="41" fill="none" stroke="#25365A" stroke-width="1" stroke-dasharray="2 4" style="stroke:var(--border, #25365A);"/>

  <!-- Blade 1 (Vibrant Cyan-Blue Focus Leaf Blade) -->
  <path d="M 50 14 C 62 14 74 24 74 38 C 74 46 68 53 58 54 C 54 48 48 42 38 40 C 36 28 42 16 50 14 Z" 
        fill="url(#leafGrad)" opacity="0.95"/>
  <!-- Leaf subtle vein in light highlight -->
  <path d="M 46 20 Q 55 35 60 48" stroke="#EAF1FB" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.75"/>
  <path d="M 50 28 Q 55 28 58 31" stroke="#EAF1FB" stroke-width="0.8" fill="none" opacity="0.6"/>
  <path d="M 53 36 Q 58 37 62 41" stroke="#EAF1FB" stroke-width="0.8" fill="none" opacity="0.6"/>

  <!-- Blade 2 -->
  <path d="M 74 38 C 82 48 83 62 76 72 C 69 77 60 76 52 70 C 53 62 52 54 48 45 C 59 41 69 39 74 38 Z" 
        fill="url(#apertureDarkGrad)" stroke="#25365A" stroke-width="1" style="stroke:var(--border, #25365A);"/>

  <!-- Blade 3 -->
  <path d="M 76 72 C 68 83 54 88 41 85 C 34 81 31 71 34 62 C 40 59 47 55 52 48 C 58 58 67 67 76 72 Z" 
        fill="url(#apertureDarkGrad)" stroke="#25365A" stroke-width="1" style="stroke:var(--border, #25365A);"/>

  <!-- Blade 4 -->
  <path d="M 41 85 C 27 84 16 74 15 60 C 16 51 23 46 32 48 C 34 56 38 63 45 70 C 41 77 41 82 41 85 Z" 
        fill="url(#apertureDarkGrad)" stroke="#25365A" stroke-width="1" style="stroke:var(--border, #25365A);"/>

  <!-- Blade 5 -->
  <path d="M 15 60 C 14 46 20 32 31 24 C 39 21 47 25 48 34 C 43 39 39 46 38 55 C 28 56 20 58 15 60 Z" 
        fill="url(#apertureDarkGrad)" stroke="#25365A" stroke-width="1" style="stroke:var(--border, #25365A);"/>

  <!-- Center Aperture Opening / Dark Iris Core -->
  <polygon points="50,42 57,46 56,54 48,57 43,51 45,44" fill="#0A1220" stroke="#25365A" stroke-width="1.2" style="fill:var(--bg, #0A1220); stroke:var(--border, #25365A);"/>

  <!-- Central Focus Dot (Cyan Focus with Glow) -->
  <circle cx="50" cy="50" r="5" fill="#22D3EE" filter="url(#focusGlow)" style="fill:var(--accent-2, #22D3EE);"/>
  <circle cx="50" cy="50" r="2.5" fill="#FFFFFF"/>
</svg>
